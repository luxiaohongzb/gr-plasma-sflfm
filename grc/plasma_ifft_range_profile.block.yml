id: plasma_ifft_range_profile
label: IFFT Range Profile
category: '[plasma]/PDU'
flags: [python]

documentation: |
  Receives PDU messages from sweep_collector containing echo data at different
  frequencies, performs pulse compression and IFFT synthesis to generate
  high-resolution range profiles, and displays them in real-time using Qt.

parameters:
  - id: bandwidth
    label: Bandwidth (Hz)
    dtype: float
    default: 30e6
  - id: pulse_width
    label: Pulse Width (s)
    dtype: float
    default: 10e-6
  - id: sample_rate
    label: Sample Rate (Hz)
    dtype: float
    default: 60e6
  - id: prf
    label: PRF (Hz)
    dtype: float
    default: 1e3
  - id: sweep_start
    label: Sweep Start Frequency (Hz)
    dtype: float
    default: 1e9
  - id: sweep_stop
    label: Sweep Stop Frequency (Hz)
    dtype: float
    default: 1.1e9
  - id: sweep_step
    label: Sweep Step Frequency (Hz)
    dtype: float
    default: 1e6
  - id: freq_key
    label: Frequency Metadata Key
    dtype: string
    default: '"rx_freq"'
    category: Metadata
  - id: n_fft_synthesis
    label: IFFT Synthesis Size
    dtype: int
    default: 256
    hide: part
  - id: dynamic_range
    label: Dynamic Range (dB)
    dtype: float
    default: 60
    hide: part
  - id: depth
    label: Message Queue Depth
    dtype: int
    default: 100
    hide: part
  - id: gui_hint
    label: GUI Hint
    dtype: gui_hint
    hide: part

inputs:
  - domain: message
    id: in

templates:
  imports: |-
    from PyQt5 import Qt
    from gnuradio import plasma
    import sip
  make: |-
    <%
      win = 'self._%s_win'%id
    %>\
    plasma.ifft_range_profile(${bandwidth}, ${pulse_width}, ${sample_rate}, ${prf}, ${sweep_start}, ${sweep_stop}, ${sweep_step}, ${freq_key}, ${n_fft_synthesis})
    self.${id}.set_dynamic_range(${dynamic_range})
    self.${id}.set_msg_queue_depth(${depth})
    ${win} = sip.wrapinstance(self.${id}.pyqwidget(), Qt.QWidget)
    ${gui_hint() % win}

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
